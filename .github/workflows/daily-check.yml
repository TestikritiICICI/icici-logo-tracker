{"name":"Daily ICICI logo check","on":{"schedule":[{"cron":"30 4 * * *"}],"workflow_dispatch":{"inputs":{"test":{"description":"Test run: save to results-server-test.json and leave today's results alone","type":"boolean","default":false}}}},"permissions":{"contents":"write"},"concurrency":{"group":"daily-check","cancel-in-progress":false},"jobs":{"check":{"runs-on":"ubuntu-24.04","timeout-minutes":180,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Install browser and OCR","run":"sudo apt-get update -q\nsudo apt-get install -y -q xvfb tesseract-ocr fonts-noto-core\npip install -q playwright==1.55.0 pillow==11.3.0 rapidocr_onnxruntime==1.4.4\npython -m playwright install --with-deps chromium"},{"name":"Restore recent screenshots from the live site","run":"if git fetch --depth 1 origin site; then\n  git worktree add --detach prev FETCH_HEAD\n  for d in prev/shots/*/; do\n    [ -d \"$d\" ] || continue\n    day=$(basename \"$d\")\n    mkdir -p \"data/daily/$day/shots\"\n    cp -n \"$d\"* \"data/daily/$day/shots/\"\n  done\nfi"},{"name":"Check every Festive Bonanza brand","run":"xvfb-run -a -s \"-screen 0 1920x1080x24\" python scripts/daily_check.py","env":{"HEADED":"1","BROWSER_CHANNEL":"chrome","SERVER_TEST":"${{ inputs.test }}"}},{"name":"Record history","run":"python scripts/record_history.py"},{"name":"Build website","run":"python scripts/build_site.py"},{"name":"Save results to main","run":"git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add data/daily data/brands.json\ngit commit -q -m \"Daily check $(TZ=Asia/Kolkata date +%F)\" || echo \"No new results\"\ngit push origin HEAD:main"},{"name":"Publish website to the site branch (Render deploys from it)","run":"export GIT_INDEX_FILE=\"$RUNNER_TEMP/site-index\"\ngit --work-tree=site add -A\ntree=$(git write-tree)\ncommit=$(git commit-tree \"$tree\" -m \"Website for $(TZ=Asia/Kolkata date +%F)\")\ngit push -f origin \"${commit}:refs/heads/site\""}]}}}
